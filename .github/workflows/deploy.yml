name: Mettre en ligne sur GitHub Pages

# À chaque fusion sur main, et à la demande depuis l'onglet Actions (« Run workflow »),
# construit le site avec Astro puis le publie sur GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois ; celle qui a commencé va jusqu'au bout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Construire le site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true # Astro demande Node 22.23.4 ou plus récent
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Donne l'adresse du site et son sous-dossier : https://claraadr.github.io et /studio-josephine,
      # ou le nom de domaine (sans sous-dossier) une fois celui-ci déclaré dans Settings → Pages.
      - name: Lire la configuration de GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Construire le site
        run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
          # Réglables sans toucher au code : Settings → Secrets and variables → Actions → Variables
          PUBLIC_FORMULAIRE_URL: ${{ vars.FORMULAIRE_URL }}
          PUBLIC_INDEXATION: ${{ vars.INDEXATION }}

      # Contrôles avant publication : si l'un échoue, le site en ligne ne change pas.
      - name: Vérifier la typographie française
        run: npm run check:typo

      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Vérifier l'accessibilité (axe, WCAG 2.2 AA)
        run: npm run check:a11y
        env:
          BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publier:
    name: Publier sur GitHub Pages
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
